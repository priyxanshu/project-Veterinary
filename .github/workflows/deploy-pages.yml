name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # Repo Pages URL is https://<user>.github.io/project-Veterinary/, so assets must
      # be built with that base path instead of the default "/".
      - name: Build citizen portal / back office / certificate app (multi-page)
        working-directory: app
        run: npx vite build --base=/project-Veterinary/

      # mpsvc-landing-page.html is a separate, self-contained prototype (not part of
      # the Vite app) — publish it alongside the built app so it's reachable too.
      - name: Add standalone landing page concept
        run: cp mpsvc-landing-page.html app/dist/landing.html

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
