name: Publish to gh-pages branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # Repo Pages URL is https://<user>.github.io/project-Veterinary/, so assets must
      # be built with that base path instead of the default "/".
      - name: Build citizen portal / back office / certificate app (multi-page)
        working-directory: app
        run: npx vite build --base=/project-Veterinary/

      # mpsvc-landing-page.html is a separate, self-contained prototype (not part of
      # the Vite app) — publish it alongside the built app so it's reachable too.
      - name: Add standalone landing page concept
        run: cp mpsvc-landing-page.html app/dist/landing.html

      # Force-pushes app/dist to the gh-pages branch (creating it on first run). Point
      # Settings → Pages → Source at "Deploy from a branch" → gh-pages → / (root).
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/dist
          publish_branch: gh-pages
